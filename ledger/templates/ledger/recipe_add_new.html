{% extends 'base.html' %}
{% block title %}Add a Recipe{% endblock %}
{% block content %}
    <a href="{% url 'ledger:recipe_list' %}">Back to Recipe List</a>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Submit</button>
    </form>
{% endblock %}
